[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "harnessminimizer"
version = "0.1.0"
description = "Minimize crashing C/C++ fuzz harnesses while preserving crash behavior"
readme = "README.md"
license-files = [
    "LICENSE",
    "THIRD_PARTY_NOTICES",
    "THIRD_PARTY_LICENSES/*.txt",
]
requires-python = ">=3.12"
dependencies = [
    "tree-sitter>=0.25.2",
    "tree-sitter-cpp>=0.23.4",
]

[project.scripts]
harnessminimizer = "harnessminimizer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/harnessminimizer"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/harnessminimizer",
    "/tests",
    "/include",
    "/README.md",
    "/tools/treereduce",
    "/tools/perses/install.py",
    "/pyproject.toml",
]

[tool.uv]
package = true
