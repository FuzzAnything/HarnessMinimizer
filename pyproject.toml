[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "harnessreducer"
version = "0.1.0"
description = "Minimize crashing C/C++ fuzz harnesses while preserving crash behavior"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "tree-sitter>=0.25.2",
    "tree-sitter-cpp>=0.23.4",
]

[project.scripts]
harnessreducer = "harnessreducer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/harnessreducer"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/harnessreducer",
    "/tests",
    "/include",
    "/README.md",
    "/tools/treereduce",
    "/tools/perses",
    "/REDUCTION_ENGINES.md",
    "/pyproject.toml",
]

[tool.uv]
package = true
